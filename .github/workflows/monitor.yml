name: B2B YUG Monitor

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run B2B monitor
        run: python monitor.py

      - name: Save monitoring results to data folder
        run: |
          mkdir -p data
          cp offers_ro_gr.csv data/offers_ro_gr.csv
          cp companies_ro_gr.csv data/companies_ro_gr.csv
          cp offers_ro_gr_clean.json data/offers_ro_gr_clean.json

      - name: Commit monitoring results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update B2B monitoring results"
          git push

      - name: Upload monitoring results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: B2B-YUG-results
          path: |
            data/offers_ro_gr.csv
            data/companies_ro_gr.csv
            data/offers_ro_gr_clean.json
