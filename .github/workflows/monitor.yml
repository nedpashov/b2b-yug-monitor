name: B2B YUG Monitor

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run B2B monitor
        run: python monitor.py
              - name: Ensure empty result files exist
        run: |
          latest_dir=$(find data/history -mindepth 1 -maxdepth 1 -type d | sort | tail -n 1)

          if [ -n "$latest_dir" ] && [ ! -f "$latest_dir/new_companies.csv" ]; then
            printf 'date,country_code,country,company_name,company_id,company_uuid,company_slug,company_ep_slug,ep_id,distribution_area,founding_year,email_existing,is_ep_member,is_wlw_member,is_quick_responder,products_count\n' > "$latest_dir/new_companies.csv"
            echo "Created empty: $latest_dir/new_companies.csv"
          fi

      - name: Show generated files
        run: |
          echo "========================================"
          echo "GENERATED FILES"
          echo "========================================"
          find data -type f | sort

      - name: Commit monitoring results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          git diff --cached --quiet || git commit -m "Update B2B monitoring results"

          git push

      - name: Upload monitoring results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: B2B-YUG-results
          path: |
            data/**
